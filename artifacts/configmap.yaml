apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: rhdh-lab
data:
  app-config-rhdh.yaml: |
    app:
      title: Portal do Desenvolvedor - Lab
      baseUrl: https://backstage-developer-hub-rhdh-lab.apps.cluster-2xw94.dyn.redhatworkshops.io
    backend:
      baseUrl: https://backstage-developer-hub-rhdh-lab.apps.cluster-2xw94.dyn.redhatworkshops.io
      cors:
        origin: https://backstage-developer-hub-rhdh-lab.apps.cluster-2xw94.dyn.redhatworkshops.io
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      externalAccess:
        - type: legacy
          options:
            secret: ${BACKEND_SECRET}
            subject: legacy-default-config
      providers:
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
        catalog:
        oidc:
          production:
            metadataUrl: ${RHBK_BASE_URL}/realms/${RHBK_REALM}/.well-known/openid-configuration
            clientId: ${RHBK_CLIENT_ID}
            clientSecret: ${RHBK_CLIENT_SECRET}
            prompt: auto
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
    signInPage: oidc
    catalog:
      locations:
        - type: url
          target: https://github.com/stheralves/rhdh-lab/blob/main/catalog/all.yaml
      rules:
        - allow:
            [
              Location,
              Group,
              User,
              System,
              Domain,
              Component,
              API,
              Resource,
              Template
            ]
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: lab
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              skipTLSVerify: true
              serviceAccountToken: ${K8S_SA_TOKEN}
    permission:
      enabled: true
      rbac:
        admin:
          users:
            - name: user:default/stheralves
            - name: user:default/user1
        policies-csv-file: /opt/app-root/src/rbac/rbac-policy.csv
        policyFileReload: true
